<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        p {
            color: blue;
            background-color: lightgray;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
    <link rel="stylesheet" href="./file.css">
    <!-- This is an example of internal styling in HTML. The CSS rules are defined within the <style> tag in the head section of the HTML document. The paragraph text will be styled according to the defined CSS properties. -->
        
    <p>EXTERNAL STYLING</p>
    <div class="file">This div is styled using an external CSS file.</div>
</body>
</html>
